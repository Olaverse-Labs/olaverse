name: Deploy docs

# The site is built from main and published to the gh-pages branch. Before this
# workflow existed the deploy was a manual `mkdocs gh-deploy`, so the published
# site drifted behind main whenever someone forgot to run it.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "olaverse/**"      # docstrings are rendered into the API reference
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write          # gh-deploy pushes to the gh-pages branch

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gh-deploy needs history for the gh-pages branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build (strict) and deploy
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --strict
