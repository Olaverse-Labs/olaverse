site_name: Olaverse
site_description: Advanced ML infrastructure and interface for Olaverse models
site_url: https://olaverse-labs.github.io/olaverse/
repo_url: https://github.com/Olaverse-Labs/olaverse

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true

nav:
  - Home: index.md
  - Core Modules:
    - NLP & Tokenization: nlp.md
    - Speech Synthesis: speech.md
    - Language Models: llm.md
    - Global Utilities: utils.md
