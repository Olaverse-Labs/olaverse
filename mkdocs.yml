site_name: Olaverse
site_description: Advanced ML infrastructure and interface for Olaverse models
site_url: https://olaverse-labs.github.io/olaverse/
repo_url: https://github.com/Olaverse-Labs/olaverse
repo_name: Olaverse-Labs/olaverse

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.png        # drop your logo here when ready
  favicon: assets/logo.png

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow

  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Olaverse-Labs
      name: Olaverse Labs on GitHub
    - icon: simple/huggingface
      link: https://huggingface.co/olaverse
      name: Olaverse on Hugging Face
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/olaverse/
      name: olaverse on PyPI

  generator: false   # hides "Made with MkDocs Material" in footer

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_category_heading: true
            members_order: source
            docstring_style: google

nav:
  - 🏠 Main Site: https://www.olaverse.co.uk/
  - Home: index.md
  - Core Modules:
    - NLP & Tokenization: nlp.md
    - Speech Synthesis: speech.md
    - Language Models: llm.md
    - Global Utilities: utils.md
