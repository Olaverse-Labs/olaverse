site_name: Olaverse
site_description: Open-source NLP infrastructure for underrepresented languages — language detection, diacritization, tokenization, retrieval, and LLMs in one Python SDK
site_url: https://olaverse-labs.github.io/olaverse/
repo_url: https://github.com/Olaverse-Labs/olaverse
repo_name: Olaverse-Labs/olaverse

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.png
  favicon: assets/logo.png

  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - announce.dismiss

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github
    admonition:
      warning: octicons/alert-16
      tip: octicons/light-bulb-16
      note: octicons/info-16

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Olaverse-Labs
      name: Olaverse Labs on GitHub
    - icon: simple/huggingface
      link: https://huggingface.co/olaverse
      name: Olaverse on Hugging Face
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/olaverse/
      name: olaverse on PyPI

  generator: false

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Substitutes {{ olaverse_version }} from olaverse/__init__.py at build time,
# so the version badge can't drift behind a release.
hooks:
  - hooks/version.py

plugins:
  - search:
      lang: en
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_category_heading: true
            show_signature_annotations: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            separate_signature: true

nav:
  - 🏠 Main Site: https://www.olaverse.co.uk/
  - Home: index.md
  - Models:
      - Overview: models/index.md
      - DiacTag — Diacritization: models/diactag.md
      - DiacNet — Diacritization: models/diacnet.md
      - Language Detection: models/language-detection.md
      - Tokenizers — OTK-BPE: models/tokenizers.md
      - Retrieval: models/retrieval.md
      - MIST — LLM Family: models/mist.md
      - LegalPeace: models/legalpeace.md
      - Prism — Vision: models/prism.md
  - Benchmarks: benchmarks.md
  - Solutions: solutions.md
  - API Reference:
      - NLP & Tokenization: nlp.md
      - Language Models: llm.md
      - Vision: vision.md
      - Datasets: datasets.md
      - Speech (Roadmap): speech.md
      - Utilities: utils.md
  - Enterprise: enterprise.md
  - Project:
      - Roadmap: roadmap.md
      - Changelog: changelog.md
